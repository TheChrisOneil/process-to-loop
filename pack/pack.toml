[pack]
name = "ptl"
version = "0.1.0"
schema = 2

# The version above is deliberately not load-bearing, and this pack is the last
# place that should pretend otherwise: 0.x.y formally permits breaking changes
# in any release. Consumers should pin a sha and record the capability surface
# with `gc <binding> preflight --accept`, which is what this pack exists to do.
requires_gc = "1.3.0"
